<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Shop - Review Report</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Smart Shop</h1>
      <p>AI-powered review report (analyzed by Google Gemini)</p>
    </div>
  </header>

  <main class="content">
    <section class="card">
      <div class="card-header">
        <h2>Review Report</h2>
        <button id="refreshBtn" class="btn">Refresh</button>
      </div>

      <div id="status" class="status" hidden></div>

      <table class="report-table">
        <thead>
          <tr>
            <th>No</th>
            <th>Product Name</th>
            <th>Total Reviews</th>
            <th>Positive</th>
            <th>Negative</th>
            <th>Neutral</th>
            <th>Average Rating</th>
          </tr>
        </thead>
        <tbody id="reportBody">
          <tr><td colspan="7" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer class="footer">
    <p>GET /api/reports/reviews &middot; Smart Shop &copy; 2026</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
